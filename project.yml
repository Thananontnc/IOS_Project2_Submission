name: MarketPortfolioPulse
options:
  bundleIdPrefix: com.marketportfoliopulse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MarketPortfolioPulse:
    type: application
    platform: iOS
    sources:
      - path: MarketPortfolioPulse
    info:
      path: MarketPortfolioPulse/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: Market & Portfolio Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marketportfoliopulse.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
